<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pick your requirements and see the architecture they call for, with the reason behind every component." />
    <title>System Design Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="min-h-screen">
    <header class="border-b border-line">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-6 py-4">
        <a href="./" class="font-semibold tracking-tight whitespace-nowrap">System Design Lab</a>
        <nav aria-label="Sections" class="-mx-3 flex gap-1 overflow-x-auto text-sm sm:mx-0">
          <a href="#build" aria-current="page" class="rounded-md bg-raised px-3 py-1.5 text-ink">Build</a>
          <span class="px-3 py-1.5 text-faint" title="Coming soon">Learn</span>
          <span class="px-3 py-1.5 text-faint" title="Coming soon">Estimate</span>
          <span class="px-3 py-1.5 text-faint" title="Coming soon">Practice</span>
        </nav>
      </div>
    </header>

    <main id="build" class="mx-auto grid max-w-7xl gap-6 px-6 py-8 lg:grid-cols-[22rem_1fr]">
      <form id="requirements" class="space-y-6 lg:sticky lg:top-6 lg:max-h-[calc(100vh-3rem)] lg:self-start lg:overflow-y-auto" aria-label="Requirements"></form>
      <section aria-labelledby="results-heading" class="min-w-0">
        <div class="mb-4 flex items-baseline justify-between gap-4">
          <h1 id="results-heading" class="text-lg font-semibold">Your architecture</h1>
          <p id="summary" class="text-sm text-muted" aria-live="polite"></p>
        </div>
        <div id="shape" class="mb-4 rounded-xl border border-line bg-panel p-4"></div>
        <div id="topology" class="mb-4 rounded-xl border border-line bg-panel p-4"></div>
        <div id="tensions" class="mb-4 space-y-3 empty:hidden"></div>
        <ol id="changes" class="mb-4 space-y-1 text-sm empty:hidden" aria-live="polite"></ol>
        <h2 class="sr-only">Components</h2>
        <ul id="results" class="grid gap-3 md:grid-cols-2"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
